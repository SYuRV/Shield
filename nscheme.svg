  <!-- СВЯЗИ -->
  <path d="M 260 215 L 290 215" class="arrow" marker-end="url(#arrowhead)" />
  <path d="M 540 235 L 570 235" class="arrow" marker-end="url(#arrowhead)" />
  <path d="M 850 235 L 880 215" class="arrow" marker-end="url(#arrowhead)" />
